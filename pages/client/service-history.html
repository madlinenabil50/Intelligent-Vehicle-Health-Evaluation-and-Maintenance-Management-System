<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Service History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>

<body class="vms-app">
    <nav class="sidebar">
        <a href="./client-dashboard.html" class="brand"><i class="bi bi-car-front-fill" style="color:#818cf8;"></i>
            IVHEMMS</a>
        <div class="sidebar-heading">My Account</div>
        <ul class="sidebar-menu">
            <li><a href="./client-dashboard.html"><i class="bi bi-house"></i> Dashboard</a></li>
            <li><a href="./vehicle-list.html"><i class="bi bi-car-front"></i> My Vehicles</a></li>
        </ul>
        <div class="sidebar-heading">Services</div>
        <ul class="sidebar-menu">
            <li><a href="./booking.html"><i class="bi bi-calendar-plus"></i> Book Service</a></li>
            <li class="active"><a href="./service-history.html"><i class="bi bi-clock-history"></i> Service History</a>
            </li>
            <li><a href="./payments.html"><i class="bi bi-credit-card"></i> Payments</a></li>
            <li><a href="./chatbot.html"><i class="bi bi-robot"></i> AI Assistant</a></li>
        </ul>
        <div class="sidebar-heading">Account</div>
        <ul class="sidebar-menu">
            <li><a href="./profile.html"><i class="bi bi-person-circle"></i> My Profile</a></li>
            <li><a href="#" class="logout-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-outline-secondary d-md-none"><i
                        class="bi bi-list"></i></button>
                <h5 class="mb-0 fw-bold">Service History</h5>
            </div>
            <div class="ms-auto"><button id="themeSwitch" class="btn btn-outline-secondary rounded-circle"
                    style="width:38px;height:38px;padding:0;"><i class="bi bi-moon-stars"></i></button></div>
        </header>
        <div class="container-fluid p-4 fade-in">
            <div class="dashboard-header">
                <div>
                    <span class="dashboard-breadcrumbs">Client / Service History</span>
                    <h1 class="dashboard-title">Service History</h1>
                </div>
                <div class="d-flex gap-2">
                    <select class="form-select form-select-sm"
                        style="width:160px;background:rgba(255,255,255,.05);border-color:var(--border-color);">
                        <option>All Vehicles</option>
                        <option>Ford Bronco</option>
                        <option>Honda Civic</option>
                    </select>
                    <button id="btnExportHistory" class="btn btn-outline-secondary btn-sm"><i
                            class="bi bi-download me-1"></i> Export PDF</button>
                </div>
            </div>

            <div class="card border-0 rounded-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0" id="serviceHistoryTable">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Service</th>
                                    <th>Vehicle</th>
                                    <th>Cost</th>
                                    <th>Status</th>
                                    <th>Invoice</th>
                                </tr>
                            </thead>
                            <tbody id="serviceHistoryBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-4">
                                        <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                        Loading...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="../../assets/js/main.js?v=20260425_v11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/service-history');
                if (res.ok) {
                    const data = await res.json();
                    const tbody = document.getElementById('serviceHistoryBody');
                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No service history found.</td></tr>`;
                    } else {
                        tbody.innerHTML = data.map(item => {
                            const dateStr = item.CreatedAt ? item.CreatedAt.split('T')[0] : '-';
                            const service = item.service_type || 'Service Appointment';
                            const vehicle = (item.Make && item.Model) ? `${item.Make} ${item.Model}` : 'Vehicle';
                            const cost = item.TotalCost ? `$${item.TotalCost}` : '-';
                            const invoice = item.Invoice_ID ? `INV-${item.Invoice_ID}` : '-';

let statusBadge = '<span class="badge bg-secondary">Unknown</span>';

if (item.Status === 'Completed') {
    statusBadge = '<span class="badge bg-success">Completed</span>';
}
else if (item.Status === 'Confirmed') {
    statusBadge = '<span class="badge bg-primary">In Progress</span>';
}
else if (item.Status === 'Scheduled') {
    statusBadge = '<span class="badge bg-warning text-dark">Scheduled</span>';
}
else if (item.Status === 'Cancelled') {
    statusBadge = '<span class="badge bg-danger">Cancelled</span>';
}

                            return `
                                <tr>
                                    <td><div class="fw-medium">${dateStr}</div></td>
                                    <td>${service}</td>
                                    <td>${vehicle} <small class="text-muted d-block">${item.PlateNumber || ''}</small></td>
                                    <td><div class="fw-bold text-white">${cost}</div></td>
                                    <td>${statusBadge}</td>
                                    <td>${invoice}</td>
                                </tr>
                            `;
                        }).join('');
                    }
                } else if (res.status === 401) {
                    window.location.href = 'login.html';
                } else {
                    document.getElementById('serviceHistoryBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Error loading history.</td></tr>`;
                }
            } catch (err) {
                console.error('Error fetching history:', err);
                document.getElementById('serviceHistoryBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Network error loading history.</td></tr>`;
            }

            // PDF Export Logic
            const exportBtn = document.getElementById('btnExportHistory');
            exportBtn.addEventListener('click', () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(18);
                doc.text('Service History Report', 14, 22);
                doc.setFontSize(11);
                doc.setTextColor(100);
                doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 30);
                
                doc.autoTable({
                    html: '#serviceHistoryTable',
                    startY: 40,
                    theme: 'grid',
                    headStyles: { fillColor: [129, 140, 248] }, // Matches brand color #818cf8
                    styles: { fontSize: 9 },
                    didParseCell: function(data) {
                        // Clean up the data if needed (e.g., removing loading text if present)
                        if (data.cell.text[0] === 'Loading...') {
                            data.cell.text = ['-'];
                        }
                    }
                });
                
                doc.save('IVHEMMS_Service_History.pdf');
            });
        });
    </script>
</body>

</html>
