<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/forms.css">
</head>

<body class="auth-bg vms-app">
    <div class="bg-glow"></div>

    <!-- Reset form card -->
    <div class="auth-card card fade-in" id="resetCard">
        <div class="card-body">
            <div class="brand-row">
                <span class="brand-pill"><i class="bi bi-car-front-fill"></i> IVHEMMS</span>
            </div>

            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Create a new secure password for your account.</p>
            <div class="auth-divider"></div>

            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required
                        minlength="6">
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required
                        minlength="6">
                </div>
                <div id="errorMsg" class="alert alert-danger d-none mb-3"
                    style="font-size: 0.9rem; padding: 0.5rem 1rem;"></div>
                <button type="submit" class="btn btn-primary btn-auth text-white">
                    <i class="bi bi-shield-lock me-2"></i> Reset Password
                </button>
            </form>
        </div>
    </div>

    <!-- Success card (hidden initially) -->
    <div class="auth-card card fade-in" id="resetSuccess" style="display:none;">
        <div class="card-body text-center">
            <div class="auth-success-icon">
                <i class="bi bi-check-circle"></i>
            </div>
            <h3 class="fw-bold mb-2">Password Reset!</h3>
            <p class="auth-subtitle mb-4">Your password has been updated successfully. You can now log in with your new
                password.</p>
            <a href="./login.html" class="btn btn-primary btn-auth text-white">
                <i class="bi bi-box-arrow-in-right me-2"></i> Log In Now
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('resetCard').innerHTML = `
                <div class="card-body text-center py-5">
                    <i class="bi bi-exclamation-triangle text-warning mb-3" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold">Invalid Link</h3>
                    <p class="text-muted">The password reset link is missing or invalid.</p>
                    <a href="./forgot-password.html" class="btn btn-outline-primary mt-3">Request New Link</a>
                </div>
            `;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorEl = document.getElementById('errorMsg');

            errorEl.classList.add('d-none');

            if (password !== confirmPassword) {
                errorEl.textContent = "Passwords do not match.";
                errorEl.classList.remove('d-none');
                return;
            }

            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Resetting...';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Failed to reset password.");

                document.getElementById('resetCard').style.display = 'none';
                document.getElementById('resetSuccess').style.display = 'block';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-shield-lock me-2"></i> Reset Password';
            }
        });
    </script>
</body>

</html>
