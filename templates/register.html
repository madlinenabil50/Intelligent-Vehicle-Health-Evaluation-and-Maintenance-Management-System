<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary-accent: #2563eb;
            --secondary-accent: #0ea5e9;
            --glow-color: rgba(37, 99, 235, 0.5);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hero-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1600&q=80');
            background-size: cover;
            background-position: 35% center;
            opacity: 1;
            filter: brightness(0.8) contrast(1.1);
            transform: scale(1.05);
            animation: slowZoom 20s infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, #020617 90%);
        }

        .landing-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .hero-section {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        @media (max-width: 991px) {
            .hero-section {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 3rem;
            }
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
            color: #fff;
        }

        .hero-content h1 span {
            background: linear-gradient(to right, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .auth-portal {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .auth-portal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to right, var(--primary-accent), var(--secondary-accent));
        }

        .form-group { margin-bottom: 1rem; }
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.35rem;
            display: block;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            color: #fff;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--primary-accent), #1e40af);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0.85rem;
            width: 100%;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.6);
            filter: brightness(1.1);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 36px; height: 36px;
            background: var(--primary-accent);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }

        .auth-footer { margin-top: 1.25rem; text-align: center; font-size: 0.85rem; color: #64748b; }
        .auth-footer a { color: var(--primary-accent); text-decoration: none; font-weight: 600; }

        /* Light Mode Overrides */
        [data-theme="light"] {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #0f172a;
            --text-muted: #475569;
        }
        [data-theme="light"] body { background: #f1f5f9 !important; color: #0f172a !important; }
        [data-theme="light"] .bg-mesh { background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.3) 0%, rgba(241, 245, 249, 0.8) 100%) !important; }
        [data-theme="light"] .hero-bg { opacity: 0.5 !important; filter: brightness(1.2) contrast(0.9) !important; }
        [data-theme="light"] .auth-portal { background: var(--glass-bg) !important; color: #0f172a; border-color: rgba(0, 0, 0, 0.05); }
        [data-theme="light"] .form-control, [data-theme="light"] .form-select { background: rgba(255, 255, 255, 0.8) !important; border-color: rgba(0, 0, 0, 0.1) !important; color: #0f172a !important; }
        [data-theme="light"] .form-label { color: #475569; }
        [data-theme="light"] .hero-content h1 { color: #0f172a; }
        [data-theme="light"] .hero-content p { color: #475569; }
        [data-theme="light"] .hero-content .fw-medium { color: #475569 !important; }
    </style>
</head>

<body>
    <div class="hero-bg"></div>
    <div class="bg-mesh"></div>

    <div class="landing-container">
        <div class="hero-section">
            <div class="hero-content">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <i class="bi bi-car-front-fill"></i>
                    </div>
                    <span>IVHEMMS</span>
                </div>

                <h1>Create Your <span>Premium Account.</span></h1>
                <p>Join our intelligent network of high-end vehicle owners and service providers. Experience maintenance like never before.</p>

                <div class="d-flex flex-wrap gap-4 mt-4">
                    <div class="d-flex align-items-center gap-2">
                        <div class="text-primary fs-5"><i class="bi bi-check-circle-fill"></i></div>
                        <span class="fw-medium">Cloud Based</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="text-primary fs-5"><i class="bi bi-check-circle-fill"></i></div>
                        <span class="fw-medium">AI Diagnostics</span>
                    </div>
                </div>
            </div>

            <div class="auth-portal fade-in">
                <h2 class="fw-bold mb-1" style="font-size: 1.5rem;">Join IVHEMMS</h2>
                <p class="text-muted small mb-3">Join our premium service network today.</p>

                <form id="registerForm" method="POST" action="/register">
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input name="firstName" type="text" class="form-control" placeholder="John" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input name="lastName" type="text" class="form-control" placeholder="Doe" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input name="email" type="email" class="form-control" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input name="phone" type="tel" class="form-control" placeholder="01XXXXXXXXX">
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label">Password</label>
                                <input name="password" type="password" class="form-control" placeholder="••••••" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label">Confirm</label>
                                <input name="passwordConfirm" type="password" class="form-control" placeholder="••••••" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-premium">
                        Create Your Account
                    </button>
                    
                    <div class="auth-footer">
                        Already have an account? <a href="./login.html">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>

</html>
