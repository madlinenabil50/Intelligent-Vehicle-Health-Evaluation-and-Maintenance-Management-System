<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.auth-bg.vms-app {
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            background-image: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            font-family: 'Inter', sans-serif;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(20px) saturate(160%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 32px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            color: #fff !important;
            width: 100%;
            max-width: 600px;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 12px !important;
            padding: 10px 15px !important;
        }

        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: #4361ee !important;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15) !important;
            color: #fff !important;
        }

        .btn-auth {
            background: #4361ee;
            border: none;
            padding: 14px;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3);
        }

        .btn-auth:hover {
            background: #3a56e4;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(67, 97, 238, 0.4);
            color: #fff;
        }

        .brand-pill {
            background: rgba(67, 97, 238, 0.1);
            border: 1px solid rgba(67, 97, 238, 0.2);
            color: #4361ee;
            padding: 8px 20px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="auth-bg vms-app">
    <div class="auth-card card fade-in">
        <div class="card-body p-4 p-md-5">
            <div class="brand-row mb-4 text-center">
                <span class="brand-pill">
                    <i class="bi bi-car-front-fill me-2"></i> IVHEMMS
                </span>
            </div>

            <h2 class="fw-bold mb-1">Create Account</h2>
            <p class="text-muted mb-4 small">Join our premium intelligent network.</p>

            <form id="registerForm" method="POST" action="/register">
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label">First Name</label>
                        <input name="firstName" type="text" class="form-control" placeholder="John" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Last Name</label>
                        <input name="lastName" type="text" class="form-control" placeholder="Doe" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email Address</label>
                        <input name="email" type="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Phone Number</label>
                        <input name="phone" type="tel" class="form-control" placeholder="+1 555 0100">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input name="address" type="text" class="form-control" placeholder="123 Main St, City">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="Client" selected>Client</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold opacity-75">Password</label>
                        <input name="password" type="password" class="form-control" placeholder="••••••" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold opacity-75">Confirm</label>
                        <input name="passwordConfirm" type="password" class="form-control" placeholder="••••••" required>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label opacity-75 small" for="termsCheck">
                                I agree to the <a href="#" class="text-white text-decoration-none fw-bold">Terms & Privacy</a>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-auth w-100 mt-4 shadow-lg">
                    <i class="bi bi-person-plus me-2"></i> Create Your Account
                </button>

                <div class="text-center mt-4">
                    <span class="text-muted small">Already have an account?</span> 
                    <a href="./login.html" class="text-primary fw-bold text-decoration-none small ms-1">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
