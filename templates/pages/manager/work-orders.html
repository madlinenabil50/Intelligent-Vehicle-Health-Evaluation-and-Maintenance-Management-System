<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Work Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/tables.css">
</head>

<body class="vms-app">
    <nav class="sidebar">
        <a href="./manager-dashboard.html" class="brand"><i class="bi bi-car-front-fill" style="color:#818cf8;"></i>
            IVHEMMS</a>
        <div class="sidebar-heading">Manager</div>
        <ul class="sidebar-menu">
            <li><a href="./manager-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="./manage-appointments.html"><i class="bi bi-calendar-check"></i> Appointments</a></li>
            <li class="active"><a href="./work-orders.html"><i class="bi bi-card-list"></i> Work Orders</a></li>
        </ul>
        <div class="sidebar-heading">Teams</div>
        <ul class="sidebar-menu">
            <li><a href="./parts-approval.html"><i class="bi bi-box-seam"></i> Parts Approval</a></li>
        </ul>
        <div class="sidebar-heading">Account</div>
        <ul class="sidebar-menu">
            <li><a href="#" class="logout-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-outline-secondary d-md-none"><i class="bi bi-list"></i></button>
                <h5 class="mb-0 fw-bold">Work Orders</h5>
            </div>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <button id="themeSwitch" class="btn btn-outline-secondary rounded-circle"
                    style="width:38px;height:38px;padding:0;"><i class="bi bi-moon-stars"></i></button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle user-profile"
                        data-bs-toggle="dropdown">
                        <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=8b5cf6&color=fff" alt="">
                        <span class="d-none d-md-inline fw-semibold topbar-username" id="topbarName">{{ user_data.firstname }} {{ user_data.lastname }}</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item text-danger logout-link" href="#"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>
        <div class="container-fluid p-4 fade-in">
            <div class="dashboard-header">
                <div>
                    <span class="dashboard-breadcrumbs">Manager / Work Orders</span>
                    <h1 class="dashboard-title">Work Orders</h1>
                </div>
                <div class="d-flex gap-2">

                    <select id="woFilter" class="form-select form-select-sm"
                        style="width:160px;background:rgba(255,255,255,.05);border-color:var(--border-color);">
                        <option value="all">All Status</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <div class="position-relative">
                        <i class="bi bi-search position-absolute text-muted" style="left:10px; top:6px; font-size:12px;"></i>
                        <input type="text" id="woSearch" class="form-control form-control-sm ps-4"
                            style="width:200px;background:rgba(255,255,255,.05);border-color:var(--border-color);"
                            placeholder="Search orders...">
                    </div>
                </div>
            </div>
            <div class="card border-0 rounded-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0" id="managerWorkOrdersTable">
                            <thead class="text-uppercase small fw-bold text-muted">
                                <tr>
                                    <th class="ps-4">WO ID</th>
                                    <th>Client</th>
                                    <th>Vehicle</th>
                                    <th>Service</th>
                                    <th>Technician Assigned</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="woTbody">
                                <tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading work orders...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/pagination.js"></script>
    <script src="../../assets/js/main.js?v=4"></script>
    <script>
        const userId = "{{ user_data.user_id }}";
        const userRole = "{{ user_data.role }}";
        const fullName = "{{ user_data.firstname }} {{ user_data.lastname }}".trim();

        if (fullName) {
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=8b5cf6&color=fff`;
        }

        let allWo = [];
        let technicians = [];
        let currentWoPage = 1;

        async function loadWorkOrders(page = 1) {
            currentWoPage = page;
            const tbody = document.getElementById('woTbody');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Loading work orders...</td></tr>';
            
            try {
                const res = await fetch(`/api/work-orders?page=${page}&_t=${Date.now()}`);
                if (!res.ok) throw new Error('Server error');
                const data = await res.json();
                allWo = data.work_orders || [];
                technicians = data.technicians || [];

                renderTable();
                renderPagination('pagination-container', data, (newPage) => {
                    loadWorkOrders(newPage);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Failed to load work orders.</td></tr>';
                renderPagination('pagination-container', null);
            }
        }

        const badgeClass = (s) => {
            const map = { 'Pending': 'warning text-dark', 'In Progress': 'info text-dark', 'Completed': 'success', 'Canceled': 'danger' };
            return map[s] || 'secondary';
        };

        function renderTable() {
            const tbody = document.getElementById('woTbody');
            const filterVal = document.getElementById('woFilter').value.toLowerCase();
            const searchVal = document.getElementById('woSearch').value.toLowerCase();

            let display = allWo.filter(w => {
                const statusMatch = filterVal === 'all' || (w.Status||'').toLowerCase() === filterVal;
                const searchMatch = !searchVal || 
                    String(w.JobCard_ID).includes(searchVal) ||
                    (w.ClientName||'').toLowerCase().includes(searchVal) ||
                    (w.Make||'').toLowerCase().includes(searchVal) ||
                    (w.service_type||'').toLowerCase().includes(searchVal);
                return statusMatch && searchMatch;
            });

            if(!display.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No matching work orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = display.map(w => `
                <tr>
                    <td class="ps-4 fw-bold text-muted">#${w.JobCard_ID}</td>
                    <td>
                        <div class="fw-semibold">${w.ClientName || 'Unknown'}</div>
                    </td>
                    <td>
                        <div class="fw-medium">${w.Make || ''} ${w.Model || ''}</div>
                        <div class="small text-muted">${w.PlateNumber || ''}</div>
                    </td>
                    <td>${w.service_type || 'N/A'}</td>
                    <td>
                        <select class="form-select form-select-sm w-auto" style="min-width:140px;" onchange="assignTech(${w.JobCard_ID}, this.value)">
                            <option value="">Unassigned</option>
                            ${technicians.map(t => {
                                const isAssigned = parseInt(t.user_id) === parseInt(w.Technician_ID);
                                const isBusy = t.status === 'Busy';
                                const disabled = isBusy && !isAssigned ? 'disabled' : '';
                                const label = isBusy && !isAssigned ? `${t.name} (Busy)` : t.name;
                                return `<option value="${t.user_id}" ${isAssigned ? 'selected' : ''} ${disabled}>${label}</option>`;
                            }).join('')}
                        </select>
                    </td>
                    <td><span class="badge bg-${badgeClass(w.Status)}">${w.Status||'Pending'}</span></td>
                </tr>
            `).join('');
        }

        async function assignTech(jobId, techId) {
            try {
                const res = await fetch('/api/assign-wo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jobcard_id: jobId, technician_id: techId || null })
                });
                if (res.ok) {
                    toast('Technician assigned successfully ✓', 'success');
                    loadWorkOrders(currentWoPage);
                } else {
                    const err = await res.json();
                    toast('Error: ' + (err.error || 'Failed to assign technician'), 'error');
                }
            } catch (e) {
                console.error(e);
                toast('Network error while assigning technician', 'error');
            }
        }

        document.getElementById('woFilter').addEventListener('change', () => loadWorkOrders(1));
        document.getElementById('woSearch').addEventListener('input', renderTable);

        loadWorkOrders();
    </script>
</body>

</html>
