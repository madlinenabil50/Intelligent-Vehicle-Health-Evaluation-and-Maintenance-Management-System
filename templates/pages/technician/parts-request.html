<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Parts Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <link rel="stylesheet" href="../../assets/css/tables.css">
</head>

<body class="vms-app">
    <nav class="sidebar">
        <a href="./technician-dashboard.html" class="brand"><i class="bi bi-car-front-fill" style="color:#818cf8;"></i>
            IVHEMMS</a>
        <div class="sidebar-heading">Technician</div>
        <ul class="sidebar-menu">
            <li><a href="./technician-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="./work-orders.html"><i class="bi bi-card-list"></i> Work Orders</a></li>
            <li><a href="./inspections.html"><i class="bi bi-clipboard-check"></i> Inspections</a></li>
            <li class="active"><a href="./parts-request.html"><i class="bi bi-box-seam"></i> Parts Request</a></li>
        </ul>
        <div class="sidebar-heading">Account</div>
        <ul class="sidebar-menu">
            <li><a href="#" class="logout-link text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-outline-secondary d-md-none"><i
                        class="bi bi-list"></i></button>
                <h5 class="mb-0 fw-bold">Parts Request</h5>
            </div>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <button id="themeSwitch" class="btn btn-outline-secondary rounded-circle"
                    style="width:38px;height:38px;padding:0;"><i class="bi bi-moon-stars"></i></button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle user-profile"
                        data-bs-toggle="dropdown">
                        <img id="userAvatar" src="https://ui-avatars.com/api/?name=Tech&background=6366f1&color=fff" alt="">
                        <span class="d-none d-md-inline fw-semibold topbar-username">{{ user_data.firstname }} {{ user_data.lastname }}</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item text-danger logout-link" href="#"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>
        <div class="container-fluid p-4 fade-in">
            <div class="dashboard-header">
                <div>
                    <span class="dashboard-breadcrumbs">Technician / Parts</span>
                    <h1 class="dashboard-title">Parts Requests</h1>
                </div>
            </div>
            <div class="row g-4">
                <!-- Request Form -->
                <div class="col-lg-5">
                    <div class="card border-0 rounded-4 p-4">
                        <h6 class="fw-bold mb-4">New Parts Request</h6>
                        <form id="partsReqForm">
                            <div class="mb-3">
                                <select class="form-select" id="partsWoSelect" name="jobcard_id" required>
                                    <option value="">Loading work orders...</option>
                                </select>
                            </div>
                            <!-- Vehicle Info Display -->
                            <div class="mb-3" id="vehicleInfoContainer" style="display: none;">
                                <label class="form-label fw-bold small text-muted">Vehicle Details</label>
                                <div class="p-3 rounded-3" style="background: var(--sidebar-hover); border: 1px solid var(--border-color);">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="p-2 bg-primary bg-opacity-10 rounded-circle text-primary">
                                            <i class="bi bi-car-front"></i>
                                        </div>
                                        <div>
                                            <h6 class="mb-0 fw-bold" id="displayVehicleName" style="color: var(--text-color);">—</h6>
                                            <small class="text-muted" id="displayVehicleModel">—</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Part Name</label>
                                <select class="form-select" id="partsItemSelect" name="item_id" required>
                                    <option value="">Select a part...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Quantity</label>
                                <input type="number" class="form-control" name="quantity" id="partsQty" min="1" value="1" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-send me-2"></i> Submit Request
                            </button>
                        </form>
                    </div>
                </div>
                <!-- My Requests -->
                <div class="col-lg-7">
                    <div class="card border-0 rounded-4">
                        <div class="card-header bg-transparent border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-0">My Requests</h6>
                            <button class="btn btn-link btn-sm text-decoration-none" onclick="loadMyRequests()">
                                <i class="bi bi-arrow-clockwise"></i> Refresh</button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table align-middle mb-0" id="partsTable">
                                    <thead>
                                        <tr>
                                            <th>Work Order</th>
                                            <th>Part</th>
                                            <th>Qty</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td colspan="4" class="text-center py-4">
                                                <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                                Loading...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div id="pagination-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/main.js?v=2.0"></script>
    <script src="../../assets/js/pagination.js"></script>
    <script>
        const userId = "{{ user_data.user_id }}";
        const userRole = "{{ user_data.role }}";
        const partsWoSelect = document.getElementById('partsWoSelect');
        const partsItemSelect = document.getElementById('partsItemSelect');
        const partsTable = document.getElementById('partsTable').querySelector('tbody');

        // Global variable to store loaded orders
        let allOrders = [];

        // Load work orders assigned to this technician
        async function loadWorkOrders() {
            try {
                const res = await fetch('/api/work-orders');
                const data = await res.json();
                allOrders = data.work_orders || data;
                partsWoSelect.innerHTML = '<option value="">Select work order...</option>' +
                    allOrders.map(o => `<option value="${o.JobCard_ID}">WO-${o.JobCard_ID} — ${o.PlateNumber || 'No Plate'}</option>`).join('');
            } catch (err) {
                console.error('Error loading work orders:', err);
                partsWoSelect.innerHTML = '<option value="">Failed to load</option>';
            }
        }

        // Handle Work Order selection change
        partsWoSelect.addEventListener('change', function() {
            const woId = this.value;
            const container = document.getElementById('vehicleInfoContainer');
            
            if (!woId) {
                container.style.display = 'none';
                loadInventory(); // Reload all if none selected
                return;
            }

            const order = allOrders.find(o => o.JobCard_ID == woId);
            if (order) {
                container.style.display = 'block';
                document.getElementById('displayVehicleName').textContent = `${order.Make} ${order.Model}`;
                document.getElementById('displayVehicleModel').textContent = `Year: ${order.Year} | ${order.PlateNumber}`;
                
                // Filter parts based on car model - try Model first, then Make
                loadInventory(order.Make, order.Model);
                toast(`Filtered parts for ${order.Make} ${order.Model}`, 'info');
            }
        });

        // Load inventory items as part options — filtered by car make/model
        async function loadInventory(carMake = '', carModel = '') {
            try {
                partsItemSelect.innerHTML = '<option value="">Filtering parts...</option>';
                
                let items = [];
                
                if (carModel) {
                    // Try filtering by model name first (e.g. "M4", "Camry")
                    const resModel = await fetch(`/api/inventory?q=${encodeURIComponent(carModel)}&page_size=100`);
                    const dataModel = await resModel.json();
                    items = dataModel.data || (Array.isArray(dataModel) ? dataModel : []);
                    
                    // If no results by model, try by make (e.g. "BMW", "Toyota")
                    if (items.length === 0 && carMake) {
                        const resMake = await fetch(`/api/inventory?q=${encodeURIComponent(carMake)}&page_size=100`);
                        const dataMake = await resMake.json();
                        items = dataMake.data || (Array.isArray(dataMake) ? dataMake : []);
                    }
                    
                    // If still no results, load all parts as fallback
                    if (items.length === 0) {
                        const resAll = await fetch('/api/inventory?page_size=100');
                        const dataAll = await resAll.json();
                        items = dataAll.data || (Array.isArray(dataAll) ? dataAll : []);
                        partsItemSelect.innerHTML = '<option value="">No model-specific parts — showing all:</option>' +
                            items.map(i => `<option value="${i.Item_ID}">${i.Name} (Stock: ${i.StockQty})</option>`).join('');
                        return;
                    }
                } else {
                    // No filter — load all
                    const res = await fetch('/api/inventory?page_size=100');
                    const data = await res.json();
                    items = data.data || (Array.isArray(data) ? data : []);
                }
                
                if (items.length === 0) {
                    partsItemSelect.innerHTML = '<option value="">No parts available</option>';
                } else {
                    partsItemSelect.innerHTML = '<option value="">Select a part...</option>' +
                        items.map(i => `<option value="${i.Item_ID}">${i.Name} (Stock: ${i.StockQty})</option>`).join('');
                }
            } catch (err) {
                console.error('Error loading inventory:', err);
                partsItemSelect.innerHTML = '<option value="">Failed to load parts</option>';
            }
        }

        // Load my parts requests
        let currentPartsPage = 1;

        async function loadMyRequests(page = 1) {
            currentPartsPage = page;
            try {
                const res = await fetch(`/api/parts-requests?page=${page}&_t=` + Date.now());
                if (!res.ok) throw new Error('Server error');
                const data = await res.json();

                const requests = data.data || data;
                if (!requests || !requests.length) {
                    partsTable.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No parts requests yet.</td></tr>';
                    renderPagination('pagination-container', null);
                    return;
                }

                partsTable.innerHTML = requests.map(p => {
                    const status = p.Status || 'Pending';
                    const badgeClass = status.toLowerCase();
                    return `
                        <tr>
                            <td class="fw-bold">PR-${p.id}</td>
                            <td>${p.ItemName || 'Unknown Part'}</td>
                            <td>${p.Quantity}</td>
                            <td><span class="status-badge ${badgeClass}">${status}</span></td>
                        </tr>
                    `;
                }).join('');

                renderPagination('pagination-container', data, (newPage) => {
                    loadMyRequests(newPage);
                });
            } catch (err) {
                console.error('Error loading parts requests:', err);
                partsTable.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-danger">Failed to load requests.</td></tr>';
            }
        }

        // Submit form
        document.getElementById('partsReqForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const jobcard_id = partsWoSelect.value;
            const item_id = partsItemSelect.value;
            const quantity = document.getElementById('partsQty').value;
            const partName = partsItemSelect.options[partsItemSelect.selectedIndex]?.text || '—';

            if (!jobcard_id || !item_id || !quantity) {
                toast('Please fill all fields', 'error');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Submitting...';

            try {
                const res = await fetch('/api/parts-requests', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jobcard_id, item_id, quantity: parseInt(quantity) })
                });
                const resData = await res.json();
                if (res.ok) {
                    toast('Part request submitted successfully ✓', 'success');
                    this.reset();
                    
                    // Simple optimistic add
                    const newRow = document.createElement('tr');
                    newRow.id = 'optimistic-row-' + Date.now();
                    newRow.innerHTML = `
                        <td class="fw-bold text-primary">NEW</td>
                        <td>${partName.split(' (')[0]}</td>
                        <td>${quantity}</td>
                        <td><span class="status-badge pending">Pending</span></td>`;
                    partsTable.prepend(newRow);

                    // Refresh from server
                    setTimeout(() => loadMyRequests(1), 800);
                } else {
                    toast('Error: ' + (resData.error || 'Submission failed'), 'error');
                }
            } catch (err) {
                console.error(err);
                toast('Network error: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        });

        // Init
        loadWorkOrders();
        loadInventory();
        loadMyRequests(1);

        // Auto-refresh every 30 seconds for status updates
        setInterval(() => loadMyRequests(currentPartsPage), 30000);
    </script>
</body>

</html>
