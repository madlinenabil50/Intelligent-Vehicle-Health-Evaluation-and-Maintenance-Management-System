    <main class="main-content">
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button id="sidebarToggle" class="btn btn-outline-secondary d-md-none"><i
                        class="bi bi-list"></i></button>
                <h5 class="mb-0 fw-bold">Create New User</h5>
            </div>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <button id="themeSwitch" class="btn btn-outline-secondary rounded-circle"
                    style="width:38px;height:38px;padding:0;"><i class="bi bi-moon-stars"></i></button>
                <div class="dropdown">
                    <a href="#"
                        class="d-flex align-items-center gap-2 text-decoration-none dropdown-toggle user-profile"
                        data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=U&background=4361ee&color=fff" alt="" class="user-profile-img">
                        <span class="d-none d-md-inline fw-semibold topbar-username"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item text-danger logout-link" href="#"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>
        <div class="container-fluid p-4 fade-in" style="max-width:680px;">
            <div class="dashboard-header">
                <div>
                    <span class="dashboard-breadcrumbs">Admin / Users / New</span>
                    <h1 class="dashboard-title">Create New User</h1>
                </div>
            </div>
            <div class="card border-0 rounded-4 p-4">
                <div id="createAlert" class="alert d-none mb-3"></div>
                <form id="userForm">
                    <input type="hidden" id="userFormEmailOriginal" value="">
                    <div class="row g-3">
                        <div class="col-12"><label class="form-label">Full Name</label><input type="text"
                                class="form-control" id="userFormName" placeholder="e.g. Jane Smith" required></div>
                        <div class="col-12"><label class="form-label">Email Address</label><input type="email"
                                class="form-control" id="userFormEmail" placeholder="jane@example.com" required></div>
                        <div class="col-12"><label class="form-label">Password</label><input type="text"
                                class="form-control" id="userFormPassword" placeholder="Set initial password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="userFormPhone" placeholder="Phone number">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" id="userFormAddress" placeholder="Home or Work Address">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Role</label>
                            <select class="form-select" id="userFormRole">
                                <option value="client">Client</option>
                                <option value="technician">Technician</option>
                                <option value="service-manager">Service Manager</option>
                                <option value="general-manager">General Manager</option>
                                <option value="stock-keeper">Stock Keeper</option>
                                <option value="finance-manager">Finance Manager</option>
                                <option value="data-analyst">Data Analyst</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i> Create
                            User</button>
                        <a href="./manage-users.html" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- Need dummy modals for JS compatibility -->
    <div id="userModal" style="display:none;"></div>
    <div id="permModal" style="display:none;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        // Update avatar with real user initial from session
        async function updateTopbarAvatar() {
            try {
                const res = await fetch('/api/session');
                if (!res.ok) return;
                const u = await res.json();
                if(u && (u.user_id || u.email)) {
                    const name = u.name || `${u.FirstName || u.firstname || ''} ${u.LastName || u.lastname || ''}`.trim() || u.email || u.Email || 'U';
                    const img = document.querySelector('.user-profile img');
                    const nameSpan = document.querySelector('.topbar-username');
                    
                    if(img) img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4361ee&color=fff`;
                    if(nameSpan) nameSpan.textContent = name.split(' ')[0] || name; // Show first name or full name
                }
            } catch(e) { /* silent */ }
        }
        updateTopbarAvatar();

        // Override the create form to redirect back to manage-users
        document.getElementById('userForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const alertBox = document.getElementById('createAlert');
            const email = document.getElementById('userFormEmail').value.trim();
            const name = document.getElementById('userFormName').value.trim();
            const role = document.getElementById('userFormRole').value;
            const password = document.getElementById('userFormPassword').value;
            const phone = document.getElementById('userFormPhone').value.trim();
            const address = document.getElementById('userFormAddress').value.trim();
            
            // Split name into first and last
            const nameParts = name.split(' ');
            const firstname = nameParts[0];
            const lastname = nameParts.slice(1).join(' ') || '';

            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i> Creating...';

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        FirstName: firstname,
                        LastName: lastname,
                        Email: email, 
                        Password: password, 
                        Role: role,
                        Phone: phone,
                        Address: address
                    })
                });

                const data = await res.json();
                if(!res.ok) throw new Error(data.error || 'Failed to create user');

                alertBox.className = 'alert alert-success mb-3';
                alertBox.innerText = 'User created successfully! Redirecting...';
                
                setTimeout(() => {
                    window.location.href = 'manage-users.html';
                }, 1500);

            } catch (err) {
                alertBox.className = 'alert alert-danger mb-3';
                alertBox.innerText = err.message;
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus me-2"></i> Create User';
            }
        });
    </script>
</body>
