<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVHEMMS — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body.auth-bg.vms-app {
            min-height: 100vh;
            margin: 0;
            background: #0f172a;
            background-image: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(20px) saturate(160%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 32px !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
            color: #fff !important;
            overflow: hidden;
            width: 100%;
            max-width: 480px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-radius: 14px !important;
            padding: 12px 18px !important;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: #4361ee !important;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.15) !important;
            color: #fff !important;
        }

        .btn-auth {
            background: #4361ee;
            border: none;
            padding: 14px;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3);
        }

        .btn-auth:hover {
            background: #3a56e4;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(67, 97, 238, 0.4);
            color: #fff;
        }

        .brand-pill {
            background: rgba(67, 97, 238, 0.1);
            border: 1px solid rgba(67, 97, 238, 0.2);
            color: #4361ee;
            padding: 8px 20px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body class="auth-bg vms-app">
    <div class="auth-card card fade-in">
        <div class="card-body p-5">
            <div class="brand-row mb-4 text-center">
                <span class="brand-pill">
                    <i class="bi bi-car-front-fill me-2"></i> IVHEMMS
                </span>
            </div>

            <h2 class="fw-bold mb-2">Welcome Back</h2>
            <p class="text-muted mb-4">Access your intelligent auto dashboard.</p>

            <form id="loginForm" method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-uppercase opacity-75">Email Address</label>
                    <input name="email" type="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-uppercase opacity-75">Password</label>
                    <input name="password" type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-auth w-100 shadow-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Portal
                </button>

                <div class="text-center mt-4">
                    <span class="text-muted small">Don't have an account?</span> 
                    <a href="./register.html" class="text-primary fw-bold text-decoration-none small ms-1">Create Account</a>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>

</html>
